[pytest]
testpaths = tests
pythonpath = .

# `-m "not live"` deselects every test that would spend API credits.
# tests/conftest.py additionally blocks real client construction, so the
# default run is offline by enforcement, not just by convention.
addopts = -q --tb=short -m "not live"

markers =
    live: performs a REAL Anthropic API call and spends credits (run with `pytest -m live`)

filterwarnings =
    ignore::UserWarning:openpyxl.*
